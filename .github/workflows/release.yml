name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version tag, for example v1.2.3 or v1.2.3-rc.1"
        required: true
        type: string

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    if: github.repository == 'poplanguage/popup'
    name: Build popup (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: crystallang/crystal:1.20.1-alpine

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: apk add --no-cache git zip

      - name: Build popup
        run: |
          set -eu
          shards install --production
          shards build popup --production --release --static --no-debug

          bundle="popup-${{ matrix.target }}"
          mkdir -p "dist/$bundle"
          cp bin/popup "dist/$bundle/$bundle"
          cd "dist/$bundle"
          zip -9 "../$bundle.zip" "$bundle"
          cd ../..
          sha256sum "dist/$bundle.zip" > "dist/$bundle.zip.sha256"
          rm -rf "dist/$bundle"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: popup-${{ matrix.target }}
          path: |
            dist/popup-${{ matrix.target }}.zip
            dist/popup-${{ matrix.target }}.zip.sha256

  publish:
    if: github.repository == 'poplanguage/popup' && github.actor == 'kleeedolinux'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: popup-*
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version tag: $tag"
            exit 1
          fi

          prerelease_args=()
          [[ "$tag" == *-* ]] && prerelease_args+=(--prerelease)

          gh release create "$tag" \
            dist/* \
            --title "$tag" \
            --generate-notes \
            "${prerelease_args[@]}"
